<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Unsubscribe &middot; Quillmatick</title>
<link rel="stylesheet" href="/tech/style.css" />
</head>
<body>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5W1REQNB57"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

  <meta name="impact-site-verification" value="47413e58-28f4-4b8a-b485-6d184eb0050b">
  <link rel="icon" type="image/png" href="/assets/img/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <script>
    (function() {
      try {
        const saved = localStorage.getItem('qm-theme');
        const theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
<main style="max-width:560px;margin:8vh auto;padding:0 24px;text-align:center">
  <h1 style="font-family:var(--font-display);font-size:26px;margin-bottom:12px">Unsubscribe</h1>
  <p id="msg" style="color:var(--ink2);line-height:1.7">Confirm below and we will stop emailing you.</p>
  <button id="go" class="btn-primary" style="margin-top:18px;cursor:pointer">Unsubscribe me</button>
  <p style="margin-top:28px"><a href="/" style="color:var(--ink3);font-size:13px">Back to Quillmatick</a></p>
</main>
<script>
(function () {
  var token = new URLSearchParams(location.search).get('token') || '';
  var msg = document.getElementById('msg');
  var go = document.getElementById('go');

  if (!token) {
    msg.textContent = 'This link is missing its unsubscribe code. Please use the link from the email.';
    go.style.display = 'none';
    return;
  }

  go.addEventListener('click', async function () {
    go.disabled = true;
    go.textContent = 'Working...';
    try {
      var res = await fetch('https://ibzoanlrduqihydokjck.supabase.co/rest/v1/rpc/unsubscribe_by_token', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imliem9hbmxyZHVxaWh5ZG9ramNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NjA2NDksImV4cCI6MjA5NjMzNjY0OX0.qa4FRt6M6JkQBm-hOUEzlm3W5BCC2_9FfQz8KxDk7rQ',
          'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imliem9hbmxyZHVxaWh5ZG9ramNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NjA2NDksImV4cCI6MjA5NjMzNjY0OX0.qa4FRt6M6JkQBm-hOUEzlm3W5BCC2_9FfQz8KxDk7rQ'
        },
        body: JSON.stringify({ p_token: token })
      });
      var removed = await res.json();
      if (res.ok && removed === true) {
        msg.textContent = 'Done — you have been unsubscribed. Sorry to see you go.';
      } else {
        // Also the path for a link already used: the row is gone, so the token matches nothing.
        msg.textContent = 'That link is no longer valid. You may already be unsubscribed.';
      }
    } catch (e) {
      msg.textContent = 'Something went wrong. Please try again in a moment.';
      go.disabled = false;
      go.textContent = 'Unsubscribe me';
      return;
    }
    go.style.display = 'none';
  });
})();
</script>
</body>
</html>
